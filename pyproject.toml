[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diplomat"
version = "0.1.0"
description = "One idle Claude Code session per machine: alarm watch, triage, relief, CPU efficiency caps, stdlib only"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
diplomat = "diplomat.cli:main"
cpu-efficiency = "diplomat.cpu:main"

[tool.setuptools]
packages = ["diplomat"]

[tool.setuptools.package-data]
diplomat = ["CLAUDE.template.md"]
